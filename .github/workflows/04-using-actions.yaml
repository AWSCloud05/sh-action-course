name: 04 - Using Actions

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setpup Node
        uses: actions/setup-node@v3
        with:
          node-version: 26
      - name: Install Dependencies
        run: npm install




        
