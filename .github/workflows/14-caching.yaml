name: 14 - Using caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: Whether to execute cache step
        type: boolean
        default: true

      node-version:
        description: Node version
        type: choice
        options:
          - 18.x
          - 20.x
          - 23.x
        default: 23.x

jobs:
  install-deps:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 04-using-actions/react-app

    outputs:
      deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Calculate cache key
        id: cache-key
        run: echo "CACHE_KEY=deps-node-modules-${{ hashFiles('04-using-actions/react-app/package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Download cache dependencies
        id: cache
        uses: actions/cache@v4
        if: ${{ inputs.use-cache }}
        with:
          path: 04-using-actions/react-app/node_modules
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci


  lint-test:
    runs-on: ubuntu-latest
    needs: install-deps

    defaults:
      run:
        working-directory: 04-using-actions/react-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download cache dependencies
        uses: actions/cache@v4
        if: ${{ inputs.use-cache }}
        with:
          path: 04-using-actions/react-app/node_modules
          key: ${{ needs.install-deps.outputs.deps-cache-key }}

      - name: Testing
        run: npm run test

      - name: Linting
        run: echo "Linting..."


  build:
    runs-on: ubuntu-latest
    needs: install-deps

    defaults:
      run:
        working-directory: 04-using-actions/react-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download cache dependencies
        uses: actions/cache@v4
        if: ${{ inputs.use-cache }}
        with:
          path: 04-using-actions/react-app/node_modules
          key: ${{ needs.install-deps.outputs.deps-cache-key }}

      - name: Building
        run: npm run build